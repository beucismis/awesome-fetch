name: Generate API

on:
  repository_dispatch:
  push:
    branches:
      - main

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Run script
        run: python readme_to_json.py README.md api.json

      - name: Run auto commit
        uses: stefanzweifel/git-auto-commit-action@v5.0.0
        with:
          commit_message: Update api.json
